name: CI

# Fast validation on every push and pull request. Unit tests avoid native
# modules and Electron by design, so the test job skips install scripts (which
# would download the Electron binary and rebuild better-sqlite3).
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (no scripts)
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

  install-check:
    name: Full dependency install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Full install including the postinstall native rebuild. Guards against a
      # broken dependency tree / better-sqlite3 ABI mismatch after upgrades.
      - name: Install dependencies
        run: npm ci
