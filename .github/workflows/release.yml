name: Build & Release

# Triggers on version tags, or can be run manually from the Actions UI.
on:
  push:
    tags:
      - 'v*'           # e.g. v1.3.1 → creates a public GitHub Release
  workflow_dispatch:   # "Run workflow" button — tags from package.json first

permissions:
  contents: write   # required to push the tag and create GitHub Releases

jobs:
  # When run manually (no tag in the ref), electron-builder can't publish —
  # GitHub rejects "Published releases must have a valid tag". So on a manual
  # run we first create and push v<version> from package.json. (The GITHUB_TOKEN
  # push intentionally does NOT trigger a second workflow run, so the build job
  # below runs once, in the same run, against the now-existing tag.)
  tag:
    name: Ensure version tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create and push v<version> tag if missing
        id: compute
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on the remote — nothing to do."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "MiTax ${TAG}"
            git push origin "refs/tags/${TAG}"
            echo "Created and pushed ${TAG}."
          fi

  release:
    name: Ensure clean GitHub Release
    needs: [tag]
    if: always() && needs.tag.result != 'failure'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve tag name
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ needs.tag.outputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # electron-builder auto-creates the GitHub Release if it doesn't see one
      # for the tag — but each OS build below runs `--publish always` in its
      # own job/process, and macOS additionally builds x64 + arm64 in parallel
      # within that one job. When more than one of these independently checks
      # "does the release exist?" at nearly the same instant, more than one
      # tries to create it; the loser gets `422 already_exists` and its whole
      # job dies, taking any assets it hadn't uploaded yet with it (this is
      # exactly what broke the v1.3.2 run: mac's arm64 build lost the race,
      # crashed, and its failure fail-fast-cancelled the Windows build mid-
      # upload). Creating (or, on a re-run, recreating from scratch) the
      # release here — once, before any build job starts — removes the race
      # entirely: every build job below only ever uploads to an already-
      # existing release. Deleting first (rather than skipping if present)
      # also means a re-run after a partial failure starts from a clean slate
      # instead of leaving stale/missing assets from the broken attempt.
      - name: Delete existing release for this tag, if any, then create fresh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve.outputs.tag }}"
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists — deleting for a clean re-publish."
            # No --cleanup-tag: that flag deletes the underlying git tag too,
            # which we want to keep (it points at the correct release commit).
            gh release delete "$TAG" --repo "$REPO" --yes
          fi
          gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes
          echo "Created clean release $TAG."

  build:
    name: Build (${{ matrix.os }})
    needs: [tag, release]
    # Run after tag/release on a manual dispatch, and also on a direct tag push
    # where the tag job is skipped (needs = skipped).
    if: always() && needs.tag.result != 'failure' && needs.release.result == 'success'
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      # The tag job has already created v<version>, so electron-builder can
      # publish to that existing tag regardless of which ref we build from.
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Set up Node.js ───────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Build & publish to GitHub Releases ───────────────────────────────
      # Builds are UNSIGNED. Do NOT set CSC_LINK / WIN_CSC_LINK to an empty
      # string here — electron-builder treats an empty-but-defined value as a
      # certificate path, resolves it to the project root and fails with
      # "<projectDir> not a file". Leaving them unset makes it skip signing.
      #
      # To enable signing later, add the `env:` block shown in the commented
      # "signing-ready" template below (only uncomment a line once its secret
      # exists), then delete the `verifyUpdateCodeSignature` override in
      # src/updater.js (that override is required only while builds are unsigned).
      - name: Build & Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # auto-provided by GitHub Actions
          CSC_IDENTITY_AUTO_DISCOVERY: "false"    # don't search the keychain; unsigned build
          # ── signing-ready template — uncomment a line only after adding its secret ──
          # macOS:   CSC_LINK / CSC_KEY_PASSWORD (Developer ID .p12, base64),
          #          APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID (notarization)
          # Windows: WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD (.pfx, base64)
          # CSC_LINK:             ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD:     ${{ secrets.CSC_KEY_PASSWORD }}
          # APPLE_ID:             ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID:        ${{ secrets.APPLE_TEAM_ID }}
          # WIN_CSC_LINK:         ${{ secrets.WIN_CSC_LINK }}
          # WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run release
        shell: bash
