name: Build & Release

# Triggers on version tags, or can be run manually from the Actions UI
on:
  push:
    tags:
      - 'v*'           # e.g. v1.1.2  → creates a public GitHub Release
  workflow_dispatch:   # allows "Run workflow" button in the Actions UI

permissions:
  contents: write   # required to create GitHub Releases and upload assets

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      # ── 1. Checkout code ───────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Set up Node.js ───────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Build & publish to GitHub Releases ───────────────────────────────
      # Builds are UNSIGNED. Do NOT set CSC_LINK / WIN_CSC_LINK to an empty
      # string here — electron-builder treats an empty-but-defined value as a
      # certificate path, resolves it to the project root and fails with
      # "<projectDir> not a file". Leaving them unset makes it skip signing.
      #
      # To enable signing later, add the `env:` block shown in the commented
      # "signing-ready" template below (only uncomment a line once its secret
      # exists), then delete the `verifyUpdateCodeSignature` override in
      # src/updater.js (that override is required only while builds are unsigned).
      - name: Build & Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # auto-provided by GitHub Actions
          CSC_IDENTITY_AUTO_DISCOVERY: "false"    # don't search the keychain; unsigned build
          # ── signing-ready template — uncomment a line only after adding its secret ──
          # macOS:   CSC_LINK / CSC_KEY_PASSWORD (Developer ID .p12, base64),
          #          APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID (notarization)
          # Windows: WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD (.pfx, base64)
          # CSC_LINK:             ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD:     ${{ secrets.CSC_KEY_PASSWORD }}
          # APPLE_ID:             ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID:        ${{ secrets.APPLE_TEAM_ID }}
          # WIN_CSC_LINK:         ${{ secrets.WIN_CSC_LINK }}
          # WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run release
        shell: bash
