name: Build & Release

# Triggers on version tags, or can be run manually from the Actions UI
on:
  push:
    tags:
      - 'v*'           # e.g. v1.1.2  → creates a public GitHub Release
  workflow_dispatch:   # allows "Run workflow" button in the Actions UI

permissions:
  contents: write   # required to create GitHub Releases and upload assets

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      # ── 1. Checkout code ───────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Set up Node.js ───────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Build & publish to GitHub Releases ───────────────────────────────
      # Code signing is OPT-IN and drop-in: every signing variable below is
      # sourced from an (optional) repo secret and scoped to the OS that uses it.
      # With no secrets set they are all empty, so electron-builder skips signing
      # and the build stays unsigned — identical to before. To enable signing:
      #   1. Add the secrets (repo → Settings → Secrets and variables → Actions):
      #      • macOS:   CSC_LINK (base64 of your Developer ID .p12), CSC_KEY_PASSWORD,
      #                 and for notarization APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
      #      • Windows: WIN_CSC_LINK (base64 of your .pfx), WIN_CSC_KEY_PASSWORD
      #   2. Delete the `verifyUpdateCodeSignature` override in src/updater.js
      #      (it is required only while builds are unsigned).
      - name: Build & Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # auto-provided by GitHub Actions
          # Don't search the keychain for an identity; explicit CSC_LINK still
          # signs when present, so this stays safe whether signed or not.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # macOS Developer ID + notarization (only exposed on the macOS runner)
          CSC_LINK:                    ${{ matrix.os == 'macos-latest' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD:            ${{ matrix.os == 'macos-latest' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID:                    ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID:               ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
          # Windows code-signing cert (only exposed on the Windows runner)
          WIN_CSC_LINK:                ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD:        ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: npm run release
        shell: bash
